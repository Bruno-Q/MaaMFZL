[build-system]  
requires = ["hatchling"]  
build-backend = "hatchling.build"  
  
[project]  
name = "MaaMFZL"  
version = "1.0.0"  
description = "这是一个使用 MaaFramework 创建的新项目。魔法之路小助手"  
dependencies = [  
    "MaaFw>=5.9.0",  
    "numpy",  
    "opencv-python"  
]  
requires-python = ">=3.8"  
  
[tool.hatch.build.targets.wheel]  
include = [  
    "MaaMFZL/",  
    "assets/",  
    "interface.json",  
    "config/"  
]